/* Theme both closed dropdown controls and their expanded option lists. */
select{accent-color:var(--yellow);color-scheme:dark;cursor:pointer}

@supports (appearance:base-select){
  select,select::picker(select){appearance:base-select}
  select{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:10px 12px;align-items:center;gap:12px}
  select::picker(select){background:var(--surface);color:var(--text);border:1px solid #5e5124;border-radius:9px;padding:5px;box-shadow:0 12px 30px #0008;max-height:320px;overflow-y:auto;margin-block:5px}

  select option{padding:9px 12px;border-radius:5px;cursor:pointer;white-space:normal;overflow-wrap:anywhere}
  select option:hover,select option:focus{background:#f5c51824;color:var(--yellow);outline:none}
  select option:checked{background:var(--yellow);color:#111}
  select option::checkmark{color:currentColor}
  select option:disabled{color:var(--muted);background:transparent;cursor:default}
  .project-picker select{padding:5px 7px;flex:1}
}
